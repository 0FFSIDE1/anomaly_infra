[build-system]
requires = ["setuptools>=65", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-infra"
description = "Reusable anomaly detection infrastructure for Django and Python projects"
license = {text = "MIT"}
authors = [
    {name = "Offside Integrated Technology (Somtochukwu Emmanuel)", email = "offsideint@gmail.com"}
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"

dynamic = ["version"]

dependencies = [
    "django>=4.2",
    "feature-flag-infra>=0.1.0",
    "redis>=7.0.1",
    "python-dotenv",
    "celery"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anomaly_infra*"]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
anomaly_infra = ["migrations/*.py"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-mock",
    "coverage"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py"]